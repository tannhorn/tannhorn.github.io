name: Build PDFs

on:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/build-pdfs.yml"
      - "_data/**"
      - "tex/**"
      - "scripts/**"
      - "requirements.txt"
      - "assets/**"
      - "!assets/cv.pdf"
      - "!assets/publications.pdf"
      - "cv.md"
      - "publications.md"
      - "_config.yml"
      - "index.md"
  pull_request:
    paths:
      - ".github/workflows/build-pdfs.yml"
      - "_data/**"
      - "tex/**"
      - "scripts/**"
      - "requirements.txt"
      - "assets/**"
      - "!assets/cv.pdf"
      - "!assets/publications.pdf"
      - "cv.md"
      - "publications.md"
      - "_config.yml"
      - "index.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          mapfile -t pdf_packages < tex/ubuntu-26.04-packages.txt
          sudo apt-get install -y --no-install-recommends "${pdf_packages[@]}"

      - name: Install Python dependencies
        run: |
          python3.14 -m venv .venv
          .venv/bin/python -c 'import sys; assert sys.version_info[:3] == (3, 14, 4), sys.version'
          .venv/bin/python -m pip install -r requirements.txt

      - name: Build PDFs
        run: scripts/build_pdf.sh

      - name: Commit PDFs
        if: github.event_name == 'push'
        run: |
          if git status --porcelain assets/cv.pdf assets/publications.pdf | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add assets/cv.pdf assets/publications.pdf
            git commit -m "Update generated PDFs"
            git push
          else
            echo "No PDF changes to commit."
          fi

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v6
        with:
          name: pdf-assets
          path: |
            assets/cv.pdf
            assets/publications.pdf
