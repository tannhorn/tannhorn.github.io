            dates: "October 2018 to September 2021"
            highlights_md:
              - "Developed numerical methods and high-fidelity simulations of phase change and nucleate boiling."
              - "Implemented numerical methods in the C++ PSI-BOIL research code; verified and validated models and investigated microlayer dynamics."
              - "Supervised four student projects, resulting in published research."
              - "Led exercise sessions for a course at ETH Zurich."

